<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0908">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Winners League UNIMET</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: tablero de liga oscuro con paneles de vidrio esmerilado sobre una cancha tenue y brillo naranja; cabecera fija estilo Winners League, contenido en columna de 1180px */
:root{
  --bg:#0A0908; --fg:#F1F1F1; --muted:#A39B92; --faint:#6E665E;
  --accent:#F4792D; --accent-soft:rgba(244,121,45,.14); --on-accent:#160B04;
  --glass:rgba(30,27,24,.50); --glass-2:rgba(44,39,35,.62); --glass-solid:rgba(22,20,18,.92);
  --line:rgba(241,241,241,.09); --line-2:rgba(241,241,241,.22); --hi:rgba(255,255,255,.06);
  --good:#5CCB7E; --bad:#F2706B; --warn:#F2C14E; --info:#6FA8F5;
  --orb-a:rgba(244,121,45,.30); --orb-b:rgba(244,121,45,.10); --pitch:rgba(241,241,241,.045);
  --shadow:0 24px 60px -28px rgba(0,0,0,.7);
  --f-display:"Inter Tight","Inter",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F6E9D6; --fg:#1B1612; --muted:#665C52; --faint:#968B7F;
  --accent:#D45F12; --accent-soft:rgba(212,95,18,.12); --on-accent:#FFF6EE;
  --glass:rgba(255,251,245,.55); --glass-2:rgba(255,251,245,.75); --glass-solid:rgba(252,246,237,.96);
  --line:rgba(27,22,18,.11); --line-2:rgba(27,22,18,.25); --hi:rgba(255,255,255,.7);
  --good:#1E9152; --bad:#C9413A; --warn:#A87410; --info:#2B66C9;
  --orb-a:rgba(244,121,45,.28); --orb-b:rgba(244,180,120,.22); --pitch:rgba(27,22,18,.06);
  --shadow:0 24px 50px -30px rgba(90,50,20,.35); color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#F6E9D6; --fg:#1B1612; --muted:#665C52; --faint:#968B7F;
  --accent:#D45F12; --accent-soft:rgba(212,95,18,.12); --on-accent:#FFF6EE;
  --glass:rgba(255,251,245,.55); --glass-2:rgba(255,251,245,.75); --glass-solid:rgba(252,246,237,.96);
  --line:rgba(27,22,18,.11); --line-2:rgba(27,22,18,.25); --hi:rgba(255,255,255,.7);
  --good:#1E9152; --bad:#C9413A; --warn:#A87410; --info:#2B66C9;
  --orb-a:rgba(244,121,45,.28); --orb-b:rgba(244,180,120,.22); --pitch:rgba(27,22,18,.06);
  --shadow:0 24px 50px -30px rgba(90,50,20,.35); color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--glass-solid)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.backdrop{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.backdrop::before{content:"";position:absolute;width:70vmax;height:70vmax;left:-20vmax;top:-30vmax;background:radial-gradient(circle,var(--orb-a),transparent 62%);filter:blur(10px)}
.backdrop::after{content:"";position:absolute;width:60vmax;height:60vmax;right:-25vmax;bottom:-25vmax;background:radial-gradient(circle,var(--orb-b),transparent 60%)}
.backdrop svg{position:absolute;inset:0;width:100%;height:100%}
.backdrop svg *{fill:none;stroke:var(--pitch);stroke-width:1.5}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* glass */
.g{background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);box-shadow:inset 0 1px 0 var(--hi),var(--shadow)}
.lbl{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:500}
.bar{width:64px;height:3px;background:var(--accent)}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--glass-solid);border-bottom:1px solid var(--line);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.top-row{display:flex;align-items:center;gap:16px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.brand svg{width:34px;height:34px;flex:none}
.brand b{display:block;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.02em;line-height:1}
.brand small{display:block;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.32em;color:var(--muted);margin-top:4px}
.top-tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.season{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;border:1px solid var(--accent);color:var(--accent);padding:5px 10px}
.rolesel{display:flex;align-items:center;gap:6px;border:1px solid var(--line-2);padding:0 0 0 10px;background:transparent}
.rolesel select{background:transparent;border:0;padding:6px 8px;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.rolesel select option{background:var(--bg);color:var(--fg)}
.icon-btn{position:relative;width:34px;height:34px;display:grid;place-items:center;background:transparent;border:1px solid var(--line);cursor:pointer;color:var(--fg)}
.icon-btn:hover{border-color:var(--line-2)}
.icon-btn svg{width:16px;height:16px}
.dot-badge{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--accent);color:var(--on-accent);font:600 10px/17px var(--f-mono);text-align:center}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.nav::-webkit-scrollbar{display:none}
.nav button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 10px 10px;font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);cursor:pointer;white-space:nowrap}
.nav button:hover{color:var(--fg)}
.nav button[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
.nav .cnt{display:inline-block;margin-left:6px;background:var(--accent);color:var(--on-accent);padding:0 5px;font-size:10px;letter-spacing:0}
.ticker{display:flex;gap:10px;align-items:center;overflow-x:auto;padding-block:8px;border-top:1px solid var(--line);scrollbar-width:none}
.ticker::-webkit-scrollbar{display:none}
.tick-item{display:flex;align-items:center;gap:8px;white-space:nowrap;background:var(--accent-soft);border:1px solid var(--line);padding:4px 10px;cursor:pointer;font-family:var(--f-mono);font-size:12px;color:var(--fg)}
.tick-item b{font-weight:600}
.banner{margin-top:14px;padding:10px 14px;border-left:3px solid var(--warn);font-size:13px;color:var(--muted)}

/* buttons, chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;border:1px solid var(--line-2);background:transparent;cursor:pointer;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg);white-space:nowrap}
.btn:hover{border-color:var(--fg)}
.btn.solid{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.solid:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);border-color:var(--line)}
.btn.sm{padding:6px 10px;font-size:10.5px}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.btn[data-armed]{background:var(--bad);color:var(--bg);border-color:var(--bad)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn svg{width:14px;height:14px}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;border-bottom:2px solid var(--accent);padding-bottom:2px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;border:1px solid currentColor;white-space:nowrap}
.chip.good{color:var(--good)}.chip.bad{color:var(--bad)}.chip.warn{color:var(--warn)}.chip.info{color:var(--info)}.chip.mute{color:var(--muted)}.chip.acc{color:var(--accent)}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 0 var(--bad);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 70%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.crest{--c:#F4792D;--ci:#160B04;display:inline-grid;place-items:center;width:30px;height:30px;flex:none;background:var(--c);color:var(--ci);font:700 10px/1 var(--f-mono);letter-spacing:.04em;clip-path:polygon(50% 0,100% 18%,100% 62%,50% 100%,0 62%,0 18%)}
.crest.lg{width:64px;height:64px;font-size:16px}
.crest.xl{width:84px;height:84px;font-size:20px}
.fav{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--line);padding:5px 9px;cursor:pointer;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.fav svg{width:13px;height:13px}
.fav:hover{color:var(--fg);border-color:var(--line-2)}
.fav[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.fav[aria-pressed="true"] svg path{fill:currentColor}

/* layout */
main{padding-block:28px 80px;display:flex;flex-direction:column;gap:28px}
.hero{display:flex;flex-direction:column;gap:14px;padding-top:12px}
.mega{font-weight:700;font-size:clamp(46px,8.6vw,108px);line-height:.86;letter-spacing:-.06em}
.mega span{color:var(--accent)}
.lede{max-width:60ch;color:var(--muted);font-size:15px;margin:0}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;padding-top:8px}
.page-head>div{display:flex;flex-direction:column;gap:14px}
.h2{font-size:clamp(30px,4.6vw,44px);font-weight:700;letter-spacing:-.045em;line-height:1}
.h3{font-size:20px;font-weight:700;letter-spacing:-.03em}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:20px;align-items:start}
.cols>*{min-width:0}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
.panel{padding:20px}
.empty{padding:28px 20px;text-align:left;display:flex;flex-direction:column;gap:10px;align-items:flex-start;color:var(--muted)}
.empty b{color:var(--fg);font-family:var(--f-display);font-size:18px;letter-spacing:-.02em}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.kpi strong{font-family:var(--f-display);font-size:30px;font-weight:700;letter-spacing:-.04em;line-height:1}
.kpi.alert strong{color:var(--accent)}

/* scoreboard */
.board{padding:0;overflow:hidden}
.board-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.board-main{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center;padding:26px 20px 18px}
.side{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;min-width:0}
.side b{font-family:var(--f-display);font-size:18px;letter-spacing:-.02em;line-height:1.1;overflow-wrap:anywhere}
.score{display:flex;flex-direction:column;align-items:center;gap:6px}
.score .sc{font-family:var(--f-display);font-weight:800;font-size:clamp(52px,9vw,84px);line-height:.9;letter-spacing:-.05em;font-variant-numeric:tabular-nums;display:flex;gap:14px;align-items:center}
.score .sc i{font-style:normal;color:var(--faint);font-weight:500}
.clock{font-family:var(--f-mono);font-size:15px;color:var(--accent);font-variant-numeric:tabular-nums}
.phase-name{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.phases{position:relative;display:flex;gap:2px;margin:0 20px;height:22px}
.ph{background:var(--line);display:grid;place-items:center;overflow:hidden;font-family:var(--f-mono);font-size:9.5px;color:var(--faint);letter-spacing:.06em}
.ph.ru{background:repeating-linear-gradient(135deg,var(--accent-soft) 0 5px,transparent 5px 10px);outline:1px solid color-mix(in srgb,var(--accent) 40%,transparent);outline-offset:-1px}
.ph.past{background:color-mix(in srgb,var(--accent) 30%,transparent);color:var(--fg)}
.ph.on{background:var(--accent);color:var(--on-accent)}
.prog{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg);left:0;transition:left .8s linear}
.ticks{display:flex;justify-content:space-between;margin:6px 20px 0;position:relative}
.ticks span:nth-child(2){position:absolute;left:50%;transform:translateX(-50%)}
.sanc{display:flex;flex-wrap:wrap;gap:8px;padding:14px 20px 0}
.sanc:empty{display:none}
.sanc .chip b{font-weight:600}
.events{list-style:none;margin:0;padding:12px 20px 18px;display:flex;flex-direction:column;gap:0;max-height:300px;overflow:auto}
.events li{display:grid;grid-template-columns:44px 22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.events li:last-child{border-bottom:0}
.events .min{font-family:var(--f-mono);color:var(--accent);font-size:12px}
.events .who{min-width:0;overflow-wrap:anywhere}
.ev-ico{width:16px;height:16px;display:block}
.card-ico{width:11px;height:15px;display:block;border-radius:1px}
.card-ico.y{background:var(--warn)}.card-ico.r{background:var(--bad)}
.ctrl{border-top:1px solid var(--line);padding:16px 20px 20px;display:flex;flex-direction:column;gap:14px;background:var(--glass-2)}
.ctrl-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctrl-teams{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ctrl-team{display:flex;flex-direction:column;gap:8px;min-width:0}
.ctrl-team .btns{display:flex;flex-wrap:wrap;gap:6px}
.btn.goal{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}

/* match list */
.mlist{display:flex;flex-direction:column}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;cursor:pointer;text-align:left;width:100%}
.mrow:hover{background:var(--accent-soft)}
.mrow[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.mrow .t{display:flex;align-items:center;gap:8px;min-width:0;font-weight:500}
.mrow .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .t.r{flex-direction:row-reverse;text-align:right}
.mrow .mid{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:74px}
.mrow .mid b{font-family:var(--f-display);font-size:19px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.mrow .mid small{font-family:var(--f-mono);font-size:10px;color:var(--muted);letter-spacing:.08em}
.group-lbl{padding:14px 14px 6px;border-bottom:1px solid var(--line)}

/* tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:center;padding:12px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{text-align:center;padding:11px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th.l,td.l{text-align:left}
tbody tr:hover{background:var(--accent-soft)}
td.pts{color:var(--accent);font-weight:600}
td.team{min-width:170px}
.tcell{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;font-weight:500;text-align:left}
.tcell .crest{width:24px;height:24px;font-size:8.5px}
tr.z-good td:first-child{box-shadow:inset 3px 0 0 var(--good)}
tr.z-acc td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
tr.z-info td:first-child{box-shadow:inset 3px 0 0 var(--info)}
tr.z-bad td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.forma{display:flex;gap:4px}
.fm{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:600 9px/1 var(--f-mono)}
.fm.G{background:var(--good);color:var(--bg)}.fm.P{background:var(--bad);color:var(--bg)}
.fm.GP{border:1.5px solid var(--good);color:var(--good)}.fm.PP{border:1.5px solid var(--bad);color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:16px;padding:12px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.leader{display:flex;align-items:center;gap:20px;padding:22px 24px;flex-wrap:wrap}
.leader .info{flex:1;min-width:180px;display:flex;flex-direction:column;gap:6px}
.leader .info .lbl{color:var(--accent)}
.leader .info b{font-family:var(--f-display);font-size:22px;letter-spacing:-.03em}
.leader .big{font-family:var(--f-display);font-weight:600;font-size:clamp(64px,10vw,96px);line-height:.85;letter-spacing:-.05em;color:var(--accent);text-align:right}
.leader .big small{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.2em;color:var(--muted);margin-top:8px}
.seg{display:inline-flex;border:1px solid var(--line-2)}
.seg button{background:none;border:0;padding:7px 12px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

/* news */
.news{display:flex;flex-direction:column;gap:14px}
.post{padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.post.pin{border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.post h3{font-size:20px;letter-spacing:-.03em;line-height:1.15}
.post p{margin:0;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;max-width:70ch}
.post .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.post .acts{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}

/* team cards */
.tcard{padding:16px;display:flex;flex-direction:column;gap:12px;cursor:pointer;text-align:left;border:1px solid var(--line);color:inherit;width:100%}
.tcard:hover{border-color:var(--line-2)}
.tcard .row{display:flex;align-items:center;gap:12px;min-width:0}
.tcard b{font-family:var(--f-display);font-size:17px;letter-spacing:-.02em;overflow-wrap:anywhere}
.tcard .foot{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* inventory */
.inv{padding:16px;display:flex;flex-direction:column;gap:12px}
.inv .top2{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.inv b{font-family:var(--f-display);font-size:18px;letter-spacing:-.02em;overflow-wrap:anywhere}
.meter{height:6px;background:var(--line);position:relative}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.meter.low i{background:var(--bad)}

<script>
(() => {

/* ---------- constantes de la liga ---------- */
const PHASES = [[0,1,'1v1 sin portero'],[1,2,'2v2'],[2,3,'3v3'],[3,4,'4v4'],[4,5,'5v5'],[5,6,'6v6'],[6,18,'7v7'],[18,20,'1v1'],[20,38,'7v7 · Ruleta'],[38,39,'2v2'],[39,40,'1v1']];

const ESTADOS = [['activo','Activo'],['lesionado','Lesionado'],['suspendido','Suspendido']];
/* Tabla de Underwood Premier tomada de unimet.winnersleague.net (2026/27-T1, jornada 6) */
const EQUIPOS_INICIALES = (() => {
  const t = [

  ];
  const o = {};
  t.forEach(([id, nombre, sigla, color, s, f]) => { const k = ['pj','g','gp','pp','p','gf','gc','ta','tr'], base = {}; k.forEach((x, i) => base[x] = s[i]); base.forma = f.split(' '); o[id] = {nombre, sigla, color, division: 'primera', base}; });
  return o;
})();
const COLS = ['equipos','jugadores','entrenadores','inventario','deudas','partidos','noticias','reportes','apoyos'];

/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const ls = {
  get(k, d = null) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const hoy = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const fFecha = f => { if (!f) return 'Sin fecha'; const d = new Date(f + 'T12:00:00'); return isNaN(d) ? f : d.toLocaleDateString('es-VE', {weekday:'short', day:'numeric', month:'short'}); };
const fHace = t => { const s = Math.round((Date.now() - t) / 1000); if (s < 60) return 'hace un momento'; if (s < 3600) return 'hace ' + Math.floor(s/60) + ' min'; if (s < 86400) return 'hace ' + Math.floor(s/3600) + ' h'; return new Date(t).toLocaleDateString('es-VE', {day:'numeric', month:'short'}); };
const money = n => '$' + (Number(n) || 0).toLocaleString('es-VE', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const hex = c => /^#[0-9a-f]{6}$/i.test(c || '') ? c : '#F4792D';
const ink = c => { c = hex(c); const r = parseInt(c.slice(1,3),16), g = parseInt(c.slice(3,5),16), b = parseInt(c.slice(5,7),16); return (0.299*r + 0.587*g + 0.114*b) > 150 ? '#140B05' : '#FFF8F0'; };
const ICON = {
  heart: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-9.2-8.6C1.2 8.2 3 4.8 6.4 4.5 8.6 4.3 10.4 5.6 12 7.6c1.6-2 3.4-3.3 5.6-3.1 3.4.3 5.2 3.7 3.6 6.9C19 15.6 12 20 12 20z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>',
  ball: '<svg class="ev-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 7.2l4.2 3-1.6 5h-5.2l-1.6-5z" fill="currentColor"/><path d="M12 7.2V2.6M16.2 10.2l4.4-1.4M14.6 15.2l2.7 3.8M9.4 15.2l-2.7 3.8M7.8 10.2 3.4 8.8" stroke="currentColor" stroke-width="1.4"/></svg>',
  wheel: '<svg class="ev-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="var(--accent)" stroke-width="1.6"/><path d="M12 2.5v19M2.5 12h19M5.3 5.3l13.4 13.4M18.7 5.3 5.3 18.7" stroke="var(--accent)" stroke-width="1.2"/><circle cx="12" cy="12" r="2.4" fill="var(--accent)"/></svg>',
  plus: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" fill="none"/></svg>'
};

/* ---------- estado ---------- */
const D = {}; COLS.forEach(c => D[c] = {});
const UI = { view: ls.get('wl-view', 'inicio'), tab: 'inventario', match: null, team: null, div: 'primera', bell: false, notifs: [], unread: 0, soloFavs: ls.get('wl-solofavs', false), sound: ls.get('wl-sound', true), loaded: {}, slow: false, readonly: false };
const ME = { id: null, admin: false, mode: 'cargando' };
let role = ls.get('wl-role', null);
let coachTeam = ls.get('wl-coach', null);
let localFavs = ls.get('wl-favs', {equipos: [], jugadores: []});
let MODAL_SUBMIT = null;

/* ---------- capa de datos: db compartida o modo local ---------- */
const Store = {
  db: null, chains: {}, local: { data: ls.get('wl-local-v1', {}), subs: {} },
  watch(col, cb) {
    if (this.db) {
      const t = setTimeout(() => { if (!UI.loaded[col]) { UI.slow = true; scheduleRender(); } }, 10000);
      return this.db.collection(col).onSnapshot(s => {
        if (!s.metadata.fromCache) clearTimeout(t);
        const o = {}; s.docs.forEach(d => { o[d.id] = Object.assign({}, d.data(), {id: d.id}); });
        cb(o, s.metadata.fromCache);
      }, e => { clearTimeout(t); UI.loaded[col] = true; if (e.code === 'revoked') UI.readonly = true; scheduleRender(); });
    }
    (this.local.subs[col] = this.local.subs[col] || []).push(cb);
    cb(this.localCol(col), false);
  },
  localCol(col) { const o = {}; for (const [k, v] of Object.entries(this.local.data[col] || {})) o[k] = Object.assign({}, v, {id: k}); return o; },
  emit(col) { (this.local.subs[col] || []).forEach(cb => cb(this.localCol(col), false)); ls.set('wl-local-v1', this.local.data); },
  queue(path, fn) { const p = (this.chains[path] || Promise.resolve()).catch(() => {}).then(fn); this.chains[path] = p.catch(() => {}); return p; },
  clean(o) { const c = JSON.parse(JSON.stringify(o)); delete c.id; return c; },
  set(col, id, data) {
    const body = this.clean(data);
    if (this.db) return this.queue(col + '/' + id, () => this.db.doc(col + '/' + id).set(body)).catch(failWrite);
    (this.local.data[col] = this.local.data[col] || {})[id] = body; this.emit(col); return Promise.resolve();
  },
  update(col, id, patch) {
    const body = this.clean(patch);
    if (this.db) return this.queue(col + '/' + id, () => this.db.doc(col + '/' + id).update(body)).catch(failWrite);
    const cur = (this.local.data[col] = this.local.data[col] || {})[id] || {};
    this.local.data[col][id] = Object.assign({}, cur, body); this.emit(col); return Promise.resolve();
  },
  del(col, id) {
    if (this.db) return this.queue(col + '/' + id, () => this.db.doc(col + '/' + id).delete()).catch(failWrite);
    if (this.local.data[col]) delete this.local.data[col][id]; this.emit(col); return Promise.resolve();
  },
  add(col, data) { const id = newId(); return this.set(col, id, data).then(() => id); }
};
function failWrite(e) {
  const c = e && e.code;
  const msg = c === 'invalid_argument' ? 'Tu acceso no permite guardar este cambio. Pide al organizador acceso de colaborador.'
    : c === 'quota_exceeded' ? 'Se llenó el espacio de la liga. Borra registros viejos e inténtalo de nuevo.'
    : 'No se pudo guardar. Revisa tu conexión e inténtalo otra vez.';
  toast('No se guardó', msg, 'err');
  throw e;
}

/* ---------- roles ---------- */
const isOrg = () => role === 'organizador' && ME.admin;
const isCoach = () => role === 'entrenador';
function roleOptions() {
  const o = [];
  if (ME.admin) o.push(['organizador', 'Organizador']);
  o.push(['entrenador', 'Entrenador'], ['jugador', 'Jugador']);
  return o;
}
function viewsFor() {
  const v = [['inicio','Inicio'],['partidos','Partidos'],['tabla','Tabla'],['noticias','Noticias']];
  if (isCoach()) v.push(['miequipo','Mi equipo']);
  v.push(['equipos','Equipos']);
  if (isOrg()) v.push(['gestion','Gestión']);
  return v;
}

/* ---------- datos derivados ---------- */
const team = id => D.equipos[id] || {nombre: 'Equipo', sigla: '—', color: '#6E665E'};
const crest = (e, cls = '') => `<span class="crest ${cls}" style="--c:${hex(e.color)};--ci:${ink(e.color)}" aria-hidden="true">${esc((e.sigla || e.nombre || '?').slice(0,3).toUpperCase())}</span>`;
const sortedTeams = () => Object.values(D.equipos).sort((a, b) => (a.nombre || '').localeCompare(b.nombre || ''));
const matches = () => Object.values(D.partidos).sort((a, b) => ((a.fecha || '') + (a.hora || '')).localeCompare((b.fecha || '') + (b.hora || '')));
const liveMatches = () => matches().filter(m => m.estado === 'vivo' || m.estado === 'pausado');
const roster = tid => Object.values(D.jugadores).filter(j => j.equipoId === tid).sort((a, b) => (+a.numero || 99) - (+b.numero || 99));
function elapsed(m) { return (+m.acum || 0) + (m.estado === 'vivo' && m.inicio ? Math.max(0, Date.now() - m.inicio) : 0); }
const minOf = ms => Math.min(40, Math.floor(ms / 60000) + 1);
const clockTxt = ms => { const s = Math.floor(ms / 1000); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
function phaseAt(ms) { const m = ms / 60000; return PHASES.find(([a, b]) => m >= a && m < b) || PHASES[PHASES.length - 1]; }
function scoreOf(evs) {
  let l = 0, v = 0;
  (evs || []).forEach(e => { if (e.tipo === 'gol') { if (e.lado === 'l') l += (+e.valor || 1); else v += (+e.valor || 1); } });
  return [l, v];
}
function playerStats() {
  const S = {};
  Object.values(D.partidos).forEach(m => (m.eventos || []).forEach(e => {
    if (!e.jugadorId) return;
    const s = S[e.jugadorId] = S[e.jugadorId] || {g: 0, ta: 0, tr: 0};
    if (e.tipo === 'gol') s.g += (+e.valor || 1); if (e.tipo === 'amarilla') s.ta++; if (e.tipo === 'roja') s.tr++;
  }));
  return S;
}
function standings(div) {
  const T = {};
  Object.values(D.equipos).filter(e => (e.division || 'primera') === div).forEach(e => {
    const b = e.base || {};
    T[e.id] = {e, pj: +b.pj||0, g: +b.g||0, gp: +b.gp||0, pp: +b.pp||0, p: +b.p||0, gf: +b.gf||0, gc: +b.gc||0, ta: +b.ta||0, tr: +b.tr||0, forma: Array.isArray(b.forma) ? b.forma.slice() : []};
  });
  matches().filter(m => m.estado === 'final' && !m.importado).forEach(m => {
    const gl = +m.gl || 0, gv = +m.gv || 0; let rl, rv;
    if (gl > gv) { rl = 'G'; rv = 'P'; } else if (gv > gl) { rl = 'P'; rv = 'G'; }
    else { const pl = +(m.pen && m.pen.l) || 0, pv = +(m.pen && m.pen.v) || 0; if (pl >= pv) { rl = 'GP'; rv = 'PP'; } else { rl = 'PP'; rv = 'GP'; } }
    [[T[m.local], gl, gv, rl, 'l'], [T[m.visita], gv, gl, rv, 'v']].forEach(([S, gf, gc, r, side]) => {
      if (!S) return;
      S.pj++; S.gf += gf; S.gc += gc; S[r.toLowerCase()]++; S.forma.push(r);
      (m.eventos || []).forEach(ev => { if (ev.lado === side) { if (ev.tipo === 'amarilla') S.ta++; if (ev.tipo === 'roja') S.tr++; } });
    });
  });
  return Object.values(T).map(s => Object.assign(s, {dg: s.gf - s.gc, pts: 3*s.g + 2*s.gp + s.pp, forma: s.forma.slice(-5)}))
    .sort((a, b) => b.pts - a.pts || b.dg - a.dg || b.gf - a.gf || (a.e.nombre || '').localeCompare(b.e.nombre || ''));
}
function fanCounts() {
  const c = {equipos: {}, jugadores: {}};
  Object.entries(D.apoyos).forEach(([id, a]) => {
    if (id === ME.id) return;
    (a.equipos || []).forEach(t => c.equipos[t] = (c.equipos[t] || 0) + 1);
    (a.jugadores || []).forEach(t => c.jugadores[t] = (c.jugadores[t] || 0) + 1);
  });
  favs().equipos.forEach(t => c.equipos[t] = (c.equipos[t] || 0) + 1);
  favs().jugadores.forEach(t => c.jugadores[t] = (c.jugadores[t] || 0) + 1);
  return c;
}
function favs() {
  const mine = ME.id && D.apoyos[ME.id];
  if (Store.db && mine) return {equipos: mine.equipos || [], jugadores: mine.jugadores || []};
  return localFavs;
}
const myReports = () => (ME.id && D.reportes[ME.id]) || null;
function allReports() {
  const out = [];
  Object.entries(D.reportes).forEach(([uid, r]) => (r.items || []).forEach(it => out.push(Object.assign({}, it, {uid, equipoId: it.equipoId || r.equipoId}))));
  return out.sort((a, b) => (b.at || 0) - (a.at || 0));
}

/* ---------- componentes ---------- */
function favBtn(kind, id, count) {
  const on = favs()[kind].includes(id);
  return `<button class="fav" data-act="fav" data-k="${kind}" data-id="${esc(id)}" aria-pressed="${on}" title="${on ? 'Dejar de apoyar' : 'Apoyar'}">${ICON.heart}<span class="num">${count || 0}</span></button>`;
}
function phaseBar(m) {
  return `<div class="phases" aria-hidden="true">${PHASES.map(([a, b, n]) => `<div class="ph ${n.includes('Ruleta') ? 'ru' : ''}" style="flex:${b - a}" data-a="${a}" data-b="${b}" data-m="${esc(m.id)}" title="${a}–${b}′ · ${esc(n)}"><span>${b - a >= 2 ? esc(n.split(' ')[0]) : ''}</span></div>`).join('')}<i class="prog" data-prog="${esc(m.id)}"></i></div>
  <div class="ticks lbl"><span>0′</span><span>20′ ventana de ruleta</span><span>40′</span></div>`;
}
function evRow(m, e) {
  const t = team(e.lado === 'l' ? m.local : m.visita);
  const ico = e.tipo === 'gol' ? ICON.ball : e.tipo === 'ruleta' ? ICON.wheel : `<i class="card-ico ${e.tipo === 'roja' ? 'r' : 'y'}"></i>`;
  const what = e.tipo === 'gol' ? (e.valor == 2 ? 'Gol doble' : 'Gol') : e.tipo === 'amarilla' ? 'Amarilla · 2′ fuera' : e.tipo === 'roja' ? 'Roja · 5′ con uno menos' : 'Ruleta: ' + esc(e.comodin || '');
  return `<li><span class="min">${e.min}′</span>${ico}<span class="who"><b>${esc(e.jugador || t.nombre)}</b> <span class="hint">${what}</span></span>${crest(t)}</li>`;
}
function statusPill(m) {
  if (m.estado === 'vivo') return '<span class="chip bad"><i class="live-dot"></i>En vivo</span>';
  if (m.estado === 'pausado') return '<span class="chip warn">Pausado</span>';
  if (m.estado === 'final') return '<span class="chip mute">Final</span>';
  return `<span class="chip acc">${esc(m.hora || 'Por definir')}</span>`;
}
function scoreboard(m, withCtrl) {
  const L = team(m.local), V = team(m.visita), fc = fanCounts();
  const evs = (m.eventos || []).slice().sort((a, b) => b.ms - a.ms);
  const started = m.estado && m.estado !== 'programado';
  const pen = m.pen ? `<span class="lbl">Penales ${+m.pen.l}–${+m.pen.v}</span>` : '';
  return `<article class="g board">
    <header class="board-top">${statusPill(m)}<span class="lbl">Jornada ${esc(m.jornada || '—')} · ${esc(fFecha(m.fecha))} · ${esc(m.cancha || 'Cancha UNIMET')}</span></header>
    <div class="board-main">
      <div class="side">${crest(L, 'xl')}<b>${esc(L.nombre)}</b>${favBtn('equipos', m.local, fc.equipos[m.local])}</div>
      <div class="score">
        <div class="sc"><span>${started ? +m.gl || 0 : '–'}</span><i>:</i><span>${started ? +m.gv || 0 : '–'}</span></div>
        ${started && m.estado !== 'final' ? `<div class="clock" data-clock="${esc(m.id)}">${clockTxt(elapsed(m))}</div><div class="phase-name" data-phase="${esc(m.id)}">${esc(phaseAt(elapsed(m))[2])}</div>` : m.estado === 'final' ? '<div class="phase-name">Final · 40′</div>' : `<div class="phase-name">${esc(m.hora || 'Hora por definir')}</div>`}
        ${pen}
      </div>
      <div class="side">${crest(V, 'xl')}<b>${esc(V.nombre)}</b>${favBtn('equipos', m.visita, fc.equipos[m.visita])}</div>
    </div>
    ${phaseBar(m)}
    <div class="sanc" data-sanc="${esc(m.id)}"></div>
    ${evs.length ? `<ol class="events">${evs.map(e => evRow(m, e)).join('')}</ol>` : `<p class="hint" style="padding:14px 20px 18px;margin:0">${started ? 'Sin incidencias todavía.' : 'Los goles, tarjetas y ruletas aparecerán aquí en tiempo real.'}</p>`}
    ${withCtrl && isOrg() ? controls(m) : ''}
  </article>`;
}
function controls(m) {
  const id = esc(m.id);
  if (!m.estado || m.estado === 'programado') return `<div class="ctrl"><span class="lbl">Mesa de control</span><div class="ctrl-row">
    <button class="btn solid" data-act="m-start" data-id="${id}">Iniciar partido</button>
    <button class="btn" data-act="m-edit" data-id="${id}">Editar</button>
    <button class="btn danger" data-act="m-del" data-id="${id}" data-confirm>Eliminar</button></div></div>`;
  if (m.estado === 'final') return `<div class="ctrl"><span class="lbl">Mesa de control</span><div class="ctrl-row">
    <button class="btn" data-act="m-reopen" data-id="${id}">Reabrir para corregir</button>
    <button class="btn" data-act="m-edit" data-id="${id}">Editar datos</button></div></div>`;
  const min = elapsed(m) / 60000, inWin = min >= 20 && min < 38;
  const used = {l: (m.eventos || []).some(e => e.tipo === 'ruleta' && e.lado === 'l'), v: (m.eventos || []).some(e => e.tipo === 'ruleta' && e.lado === 'v')};
  const side = (s) => { const t = team(s === 'l' ? m.local : m.visita); return `<div class="ctrl-team"><span class="lbl">${esc(t.nombre)}</span><div class="btns">
    <button class="btn goal sm" data-act="ev-gol" data-id="${id}" data-s="${s}">${ICON.plus}Gol</button>
    <button class="btn sm" data-act="ev-card" data-t="amarilla" data-id="${id}" data-s="${s}"><i class="card-ico y"></i>Amarilla</button>
    <button class="btn sm" data-act="ev-card" data-t="roja" data-id="${id}" data-s="${s}"><i class="card-ico r"></i>Roja</button>
    <button class="btn sm" data-act="ev-ruleta" data-id="${id}" data-s="${s}" ${used[s] ? 'disabled title="Ya usó su ruleta"' : inWin ? '' : 'data-off title="Disponible del 20′ al 38′"'}>Ruleta${used[s] ? ' usada' : ''}</button>
  </div></div>`; };
  return `<div class="ctrl"><div class="ctrl-row"><span class="lbl" style="margin-right:auto">Mesa de control</span>
    ${m.estado === 'vivo' ? `<button class="btn" data-act="m-pause" data-id="${id}">Pausar reloj</button>` : `<button class="btn solid" data-act="m-resume" data-id="${id}">Reanudar</button>`}
    <button class="btn ghost" data-act="ev-undo" data-id="${id}" ${(m.eventos || []).length ? '' : 'disabled'}>Deshacer última</button>
    <button class="btn danger" data-act="m-final" data-id="${id}" data-confirm>Finalizar</button></div>
    <div class="ctrl-teams">${side('l')}${side('v')}</div></div>`;
}
function matchRow(m) {
  const L = team(m.local), V = team(m.visita), started = m.estado && m.estado !== 'programado';
  const mid = started ? `<b>${+m.gl || 0} – ${+m.gv || 0}</b><small>${m.estado === 'final' ? (m.pen ? `PEN ${+m.pen.l}-${+m.pen.v}` : 'FINAL') : `<span data-clock="${esc(m.id)}">${clockTxt(elapsed(m))}</span>`}</small>` : `<b>${esc(m.hora || '—')}</b><small>${esc(fFecha(m.fecha))}</small>`;
  return `<button class="mrow" data-act="pick-match" data-id="${esc(m.id)}" aria-current="${UI.match === m.id}">
    <span class="t">${crest(L)}<span>${esc(L.nombre)}</span></span><span class="mid">${mid}</span><span class="t r">${crest(V)}<span>${esc(V.nombre)}</span></span></button>`;
}
function formaChips(f) { return `<span class="forma">${f.map(r => `<span class="fm ${r}" title="${({G:'Ganado',GP:'Ganado por penales',PP:'Perdido por penales',P:'Perdido'})[r] || r}">${r[0]}</span>`).join('')}</span>`; }
function leaderCard(s) {
  return `<div class="g leader">${crest(s.e, 'lg')}<div class="info"><span class="lbl">Líder</span><b>${esc(s.e.nombre)}</b><span class="hint num">${s.pj} PJ · ${s.g}G ${s.gp}GP ${s.pp}PP ${s.p}P · DG ${s.dg > 0 ? '+' : ''}${s.dg}</span>${formaChips(s.forma)}</div><div class="big num">${s.pts}<small>PTS</small></div></div>`;
}
function emptyBox(title, text, btn) { return `<div class="g empty"><b>${title}</b><span>${text}</span>${btn || ''}</div>`; }

/* ---------- vistas ---------- */
const VIEWS = {};
VIEWS.inicio = () => {
  const lives = liveMatches(), next = matches().filter(m => !m.estado || m.estado === 'programado');
  const today = matches().filter(m => m.fecha === hoy());
  const st = standings('primera');
  const news = Object.values(D.noticias).sort((a, b) => (b.fijada ? 1 : 0) - (a.fijada ? 1 : 0) || (b.at || 0) - (a.at || 0)).slice(0, 3);
  const lede = isOrg() ? 'Mesa del organizador: marcador en vivo, inventario, plantillas, deudas y anuncios en un solo lugar.'
    : isCoach() ? 'Tu plantilla, los reportes de lesión y el calendario de tu equipo.'
    : 'Marcadores en vivo, la tabla de posiciones y las noticias de la liga. Apoya a tus equipos y recibe un aviso con cada gol.';
  let featured = lives[0] || next[0] || null;
  let side = '';
  if (isOrg()) {
    const pend = allReports().filter(r => !r.atendido).length;
    const debt = Object.values(D.deudas).filter(d => !d.pagada).reduce((s, d) => s + (+d.monto || 0), 0);
    const low = Object.values(D.inventario).filter(i => (+i.total || 0) > 0 && (+i.disponibles || 0) / (+i.total) < .3).length;
    side = `<div class="kpis">
      <button class="g kpi ${pend ? 'alert' : ''}" data-act="goto-tab" data-t="lesiones" style="text-align:left;cursor:pointer;color:inherit"><span class="lbl">Lesiones por atender</span><strong class="num">${pend}</strong></button>
      <button class="g kpi" data-act="goto-tab" data-t="deudas" style="text-align:left;cursor:pointer;color:inherit"><span class="lbl">Deuda pendiente</span><strong class="num">${money(debt)}</strong></button>
      <button class="g kpi ${low ? 'alert' : ''}" data-act="goto-tab" data-t="inventario" style="text-align:left;cursor:pointer;color:inherit"><span class="lbl">Material bajo</span><strong class="num">${low}</strong></button>
    </div>`;
  }
  const fv = favs(), fc = fanCounts();
  const favBlock = !isOrg() && !isCoach() ? `<section><div class="sec-head"><h3 class="h3">Tus favoritos</h3><button class="link" data-act="view" data-v="equipos">Elegir equipos</button></div>
    ${fv.equipos.length ? `<div class="grid-cards">${fv.equipos.map(id => D.equipos[id]).filter(Boolean).map(e => teamCard(e, fc)).join('')}</div>` : emptyBox('Aún no apoyas a ningún equipo', 'Toca el corazón de un equipo o jugador. Te avisaremos primero de sus goles.', '<button class="btn" data-act="view" data-v="equipos">Ver equipos</button>')}</section>` : '';
  return `<section class="hero"><span class="lbl">Underwood Premier · Temporada 2026/27-T1</span><div class="bar"></div>
      <h1 class="mega">Winners League <span>UNIMET</span></h1><p class="lede">${lede}</p></section>
    ${side}
    <div class="cols">
      <div class="stack">
        <div><div class="sec-head"><h3 class="h3">${lives.length ? 'En vivo ahora' : 'Próximo partido'}</h3><button class="link" data-act="view" data-v="partidos">Todos los partidos →</button></div>
        ${featured ? scoreboard(featured, false) : emptyBox('No hay partidos programados', isOrg() ? 'Programa la próxima jornada para que aparezca el marcador.' : 'Cuando el organizador publique la jornada, verás aquí el marcador.', isOrg() ? '<button class="btn solid" data-act="m-new">Programar partido</button>' : '')}</div>
        <div><div class="sec-head"><h3 class="h3">Jornada del día</h3><span class="lbl">${esc(fFecha(hoy()))}</span></div>
        ${today.length ? `<div class="g mlist">${today.map(matchRow).join('')}</div>` : emptyBox('Hoy no hay partidos', 'Los partidos con fecha de hoy aparecen aquí.')}</div>
      </div>
      <div class="stack">
        ${st[0] ? leaderCard(st[0]) : ''}
        <div class="g"><div class="sec-head" style="padding:16px 16px 0"><h3 class="h3">Tabla</h3><button class="link" data-act="view" data-v="tabla">Completa →</button></div>
        ${st.length ? `<div class="tbl-wrap"><table><thead><tr><th>#</th><th class="l">Equipo</th><th>PJ</th><th>DG</th><th>PTS</th></tr></thead><tbody>${st.slice(0, 6).map((s, i) => `<tr><td>${i + 1}</td><td class="l"><button class="tcell" data-act="team" data-id="${esc(s.e.id)}">${crest(s.e)}${esc(s.e.nombre)}</button></td><td>${s.pj}</td><td>${s.dg}</td><td class="pts">${s.pts}</td></tr>`).join('')}</tbody></table></div>` : '<p class="hint" style="padding:0 16px 16px">Los equipos aparecerán cuando el organizador los registre.</p>'}</div>
        <div><div class="sec-head"><h3 class="h3">Noticias</h3><button class="link" data-act="view" data-v="noticias">Ver todas →</button></div>
        ${news.length ? `<div class="news">${news.map(n => postCard(n, false)).join('')}</div>` : emptyBox('Sin noticias todavía', 'Los anuncios del organizador aparecerán aquí.')}</div>
      </div>
    </div>
    ${favBlock}`;
};

VIEWS.partidos = () => {
  const all = matches();
  const live = all.filter(m => m.estado === 'vivo' || m.estado === 'pausado');
  const prox = all.filter(m => !m.estado || m.estado === 'programado');
  const fin = all.filter(m => m.estado === 'final').reverse();
  if (!UI.match || !D.partidos[UI.match]) UI.match = (live[0] || prox[0] || fin[0] || {}).id || null;
  const sel = UI.match && D.partidos[UI.match];
  const grp = (t, list) => list.length ? `<div class="group-lbl lbl">${t}</div>${list.map(matchRow).join('')}` : '';
  const byJ = {}; fin.forEach(m => (byJ[m.jornada || '—'] = byJ[m.jornada || '—'] || []).push(m));
  return `<div class="page-head"><div><div class="bar"></div><h2 class="h2">Partidos y resultados</h2></div>${isOrg() ? '<button class="btn solid" data-act="m-new">Programar partido</button>' : ''}</div>
  ${all.length ? `<div class="split">
    <div class="g mlist sticky" style="max-height:calc(100vh - 160px);overflow:auto">${grp('En vivo', live)}${grp('Próximos', prox)}${Object.entries(byJ).map(([j, l]) => grp('Resultados · Jornada ' + j, l)).join('')}</div>
    <div>${sel ? scoreboard(sel, true) : ''}</div></div>`
  : emptyBox('Todavía no hay partidos', isOrg() ? 'Programa el primer partido: jornada, fecha, hora y los dos equipos.' : 'El calendario aparecerá cuando el organizador lo publique.', isOrg() ? '<button class="btn solid" data-act="m-new">Programar partido</button>' : '')}`;
};

VIEWS.tabla = () => {
  const st = standings(UI.div), n = st.length;
  const zone = i => UI.div !== 'primera' ? '' : i < 6 ? 'z-good' : i < 10 ? 'z-acc' : (n >= 12 && i === n - 1) ? 'z-bad' : (n >= 12 && i === n - 2) ? 'z-info' : '';
  const ps = playerStats();
  const scorers = Object.entries(ps).filter(([, s]) => s.g > 0).map(([id, s]) => ({j: D.jugadores[id], s})).filter(x => x.j && team(x.j.equipoId) && (team(x.j.equipoId).division || 'primera') === UI.div).sort((a, b) => b.s.g - a.s.g).slice(0, 10);
  return `<div class="page-head"><div><div class="bar"></div><h2 class="h2">${UI.div === 'primera' ? 'Underwood Premier' : 'Segunda División'} · Posiciones</h2></div>
    <div class="seg" role="group" aria-label="División"><button data-act="div" data-v="primera" aria-pressed="${UI.div === 'primera'}">Primera</button><button data-act="div" data-v="segunda" aria-pressed="${UI.div === 'segunda'}">Segunda</button></div></div>
  ${n ? leaderCard(st[0]) + `<div class="g"><div class="tbl-wrap"><table>
    <thead><tr><th>#</th><th class="l">Equipo</th><th>PJ</th><th>G</th><th>GP</th><th>PP</th><th>P</th><th>GF</th><th>GC</th><th>DG</th><th>TA</th><th>TR</th><th>PTS</th><th class="l">Forma</th></tr></thead>
    <tbody>${st.map((s, i) => `<tr class="${zone(i)}"><td>${i + 1}</td><td class="l team"><button class="tcell" data-act="team" data-id="${esc(s.e.id)}">${crest(s.e)}${esc(s.e.nombre)}</button></td><td>${s.pj}</td><td>${s.g}</td><td>${s.gp}</td><td>${s.pp}</td><td>${s.p}</td><td>${s.gf}</td><td>${s.gc}</td><td>${s.dg}</td><td>${s.ta}</td><td>${s.tr}</td><td class="pts">${s.pts}</td><td class="l">${formaChips(s.forma)}</td></tr>`).join('')}</tbody></table></div>
    ${UI.div === 'primera' ? '<div class="legend"><span><i style="background:var(--good)"></i>Clasificación directa</span><span><i style="background:var(--accent)"></i>Zona de Play-In</span><span><i style="background:var(--info)"></i>Play off de ascenso</span><span><i style="background:var(--bad)"></i>Descenso</span></div>' : ''}
    <div class="legend"><span>G ganado = 3</span><span>GP ganado por penales = 2</span><span>PP perdido por penales = 1</span><span>P perdido = 0</span></div></div>`
  : emptyBox('No hay equipos en esta división', isOrg() ? 'Regístralos en Gestión → Equipos.' : 'La tabla aparecerá cuando el organizador registre los equipos.')}
  <section><div class="sec-head"><h3 class="h3">Goleadores</h3><span class="lbl">Goles registrados en esta app</span></div>
  ${scorers.length ? `<div class="g tbl-wrap"><table><thead><tr><th>#</th><th class="l">Jugador</th><th class="l">Equipo</th><th>Goles</th><th>TA</th><th>TR</th></tr></thead><tbody>${scorers.map((x, i) => `<tr><td>${i + 1}</td><td class="l">${esc(x.j.nombre)}</td><td class="l"><button class="tcell" data-act="team" data-id="${esc(x.j.equipoId)}">${crest(team(x.j.equipoId))}${esc(team(x.j.equipoId).nombre)}</button></td><td class="pts">${x.s.g}</td><td>${x.s.ta}</td><td>${x.s.tr}</td></tr>`).join('')}</tbody></table></div>` : emptyBox('Sin goles registrados', 'Los goles marcados desde la mesa de control alimentan esta lista.')}</section>`;
};

function postCard(n, full) {
  const tipo = {anuncio: ['acc', 'Anuncio'], aviso: ['warn', 'Aviso'], resultado: ['good', 'Resultado']}[n.tipo] || ['mute', 'Nota'];
  return `<article class="g post ${n.fijada ? 'pin' : ''}"><div class="meta"><span class="chip ${tipo[0]}">${tipo[1]}</span>${n.fijada ? '<span class="lbl" style="color:var(--accent)">Fijada</span>' : ''}<span class="lbl">${n.at ? esc(fHace(n.at)) : ''}</span></div>
    <h3>${esc(n.titulo)}</h3>${n.cuerpo ? `<p>${esc(full ? n.cuerpo : (n.cuerpo.length > 220 ? n.cuerpo.slice(0, 220) + '…' : n.cuerpo))}</p>` : ''}
    ${full && isOrg() ? `<div class="acts"><button class="btn sm" data-act="n-pin" data-id="${esc(n.id)}">${n.fijada ? 'Desfijar' : 'Fijar arriba'}</button><button class="btn sm" data-act="n-edit" data-id="${esc(n.id)}">Editar</button><button class="btn sm danger" data-act="n-del" data-id="${esc(n.id)}" data-confirm>Borrar</button></div>` : ''}</article>`;
}
VIEWS.noticias = () => {
  const list = Object.values(D.noticias).sort((a, b) => (b.fijada ? 1 : 0) - (a.fijada ? 1 : 0) || (b.at || 0) - (a.at || 0));
  return `<div class="page-head"><div><div class="bar"></div><h2 class="h2">Noticias y anuncios</h2></div>${isOrg() ? '<button class="btn solid" data-act="n-new">Publicar anuncio</button>' : ''}</div>
  ${list.length ? `<div class="news" style="max-width:780px">${list.map(n => postCard(n, true)).join('')}</div>` : emptyBox('No hay noticias publicadas', isOrg() ? 'Publica el primer anuncio. Los resultados finales también se publican solos aquí.' : 'Los anuncios del organizador aparecerán aquí.', isOrg() ? '<button class="btn solid" data-act="n-new">Publicar anuncio</button>' : '')}`;
};

function teamCard(e, fc) {
  const coach = Object.values(D.entrenadores).find(c => c.equipoId === e.id);
  return `<div class="g tcard" data-act="team" data-id="${esc(e.id)}" role="button" tabindex="0"><div class="row">${crest(e, 'lg')}<div style="min-width:0"><b>${esc(e.nombre)}</b><div class="lbl">${e.division === 'segunda' ? 'Segunda' : 'Primera'} · ${roster(e.id).length} jugadores</div></div></div>
    <div class="foot"><span class="hint">${coach ? 'DT ' + esc(coach.nombre) : 'Sin entrenador registrado'}</span>${favBtn('equipos', e.id, fc.equipos[e.id])}</div></div>`;
}
function rosterTable(tid, opts = {}) {
  const ps = playerStats(), fc = fanCounts(), list = roster(tid);

function pushEvent(m, ev) {
  const evs = (m.eventos || []).concat([Object.assign({id: newId(), at: Date.now()}, ev)]);
  const [gl, gv] = scoreOf(evs);
  return Store.update('partidos', m.id, {eventos: evs, gl, gv});
}
function eventModal(m, s, tipo) {
  const tid = s === 'l' ? m.local : m.visita, t = team(tid), r = roster(tid);
  const ms = elapsed(m), min = minOf(ms);
  const opts = [['', 'Sin asignar']].concat(r.map(j => [j.id, (j.numero ? j.numero + ' · ' : '') + j.nombre]));
  const titles = {gol: 'Gol de ' + t.nombre, amarilla: 'Amarilla · ' + t.nombre, roja: 'Roja · ' + t.nombre, ruleta: 'Ruleta de ' + t.nombre};
  let fields = tipo === 'ruleta' ? F.sel('comodin', 'Comodín que salió', COMODINES.map(c => [c, c]), '', true) : F.sel('jugadorId', 'Jugador', opts, '', true);
  if (tipo === 'gol') fields += F.chk('doble', 'Gol doble (comodín “Gol Doble por 4 Minutos” activo)', false);
  fields += F.num('min', 'Minuto', min, 'min="1" max="40"');
  openModal(titles[tipo], fields, 'Registrar', d => {
    const mm = D.partidos[m.id]; if (!mm) return;
    const minute = Math.min(40, Math.max(1, parseInt(d.min) || min));
    const j = d.jugadorId ? D.jugadores[d.jugadorId] : null;
    const ev = {tipo, lado: s, min: minute, ms: minute === min ? elapsed(mm) : (minute - 1) * 60000};
    if (j) { ev.jugadorId = j.id; ev.jugador = j.nombre; }
    if (tipo === 'gol') ev.valor = d.doble ? 2 : 1;

}
function finalize(m) {

    const L = team(m.local), V = team(m.visita);
    const goles = (m.eventos || []).filter(e => e.tipo === 'gol' && e.jugador).map(e => `${e.jugador} ${e.min}′`).join(', ');
    Store.add('noticias', {tipo: 'resultado', fijada: false, at: Date.now(), titulo: `${L.nombre} ${+m.gl || 0}–${+m.gv || 0} ${V.nombre}${pen ? ` (${pen.l}-${pen.v} pen.)` : ''}`,

  };
  if ((+m.gl || 0) === (+m.gv || 0)) {
    openModal('Empate: definición por penales', `<p class="hint full" style="margin:0">El ganador por penales suma 2 puntos y el perdedor 1.</p>` + F.num('pl', 'Penales ' + team(m.local).nombre, '', 'min="0"') + F.num('pv', 'Penales ' + team(m.visita).nombre, '', 'min="0"'),
      'Finalizar partido', d => { const l = parseInt(d.pl), v = parseInt(d.pv); if (isNaN(l) || isNaN(v) || l === v) return formErr('Indica los penales de cada equipo; no pueden quedar iguales.'); doFinal({l, v}); });

let audioCtx = null;
function beep() {
  if (!UI.sound || !audioCtx) return;
  try { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.type = 'triangle'; o.frequency.setValueAtTime(880, audioCtx.currentTime); o.frequency.setValueAtTime(1320, audioCtx.currentTime + .12);
    g.gain.setValueAtTime(.0001, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(.2, audioCtx.currentTime + .02); g.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime + .45);
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + .5); } catch {}
}
function toast(title, text, kind, tag) {

}

}

function tick() {
  document.querySelectorAll('[data-clock]').forEach(el => { const m = D.partidos[el.dataset.clock]; if (m) el.textContent = clockTxt(elapsed(m)); });
  document.querySelectorAll('[data-phase]').forEach(el => { const m = D.partidos[el.dataset.phase]; if (m) el.textContent = phaseAt(elapsed(m))[2]; });
  document.querySelectorAll('[data-prog]').forEach(el => {
    const m = D.partidos[el.dataset.prog]; if (!m) return;
    const started = m.estado && m.estado !== 'programado', ms = m.estado === 'final' ? 2400000 : elapsed(m), min = ms / 60000;
    el.style.left = Math.min(100, ms / 24000) + '%'; el.hidden = !started;
    el.parentNode.querySelectorAll('.ph').forEach(p => { const a = +p.dataset.a, bb = +p.dataset.b; p.classList.toggle('past', started && min >= bb); p.classList.toggle('on', started && m.estado !== 'final' && min >= a && min < bb); });
  });
  document.querySelectorAll('[data-sanc]').forEach(el => {
    const m = D.partidos[el.dataset.sanc]; if (!m || m.estado === 'final') { el.innerHTML = ''; return; }
    const now = elapsed(m);
    const act = (m.eventos || []).filter(e => SANC_MS[e.tipo] && now >= e.ms && now < e.ms + SANC_MS[e.tipo]);
    el.innerHTML = act.map(e => `<span class="chip ${e.tipo === 'roja' ? 'bad' : 'warn'}"><i class="card-ico ${e.tipo === 'roja' ? 'r' : 'y'}" style="width:8px;height:11px"></i><b>${esc(e.jugador || team(e.lado === 'l' ? m.local : m.visita).sigla)}</b> fuera ${clockTxt(e.ms + SANC_MS[e.tipo] - now)}</span>`).join('');
  });
  document.querySelectorAll('[data-off]').forEach(btn => { const m = D.partidos[btn.dataset.id]; if (m) { const min = elapsed(m) / 60000; btn.disabled = !(min >= 20 && min < 38); } });
}

document.addEventListener('click', ev => {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} }
  const el = ev.target.closest('[data-act]');
  if (UI.bell && !ev.target.closest('#bell') && !ev.target.closest('#bell-btn')) { UI.bell = false; $('#bell').hidden = true; }
  if (!el) return;
  if (el.hasAttribute('data-confirm') && !el.hasAttribute('data-armed')) {
    ev.preventDefault(); const txt = el.textContent; el.setAttribute('data-armed', ''); el.textContent = '¿Confirmar?';
    setTimeout(() => { if (el.isConnected) { el.removeAttribute('data-armed'); el.textContent = txt; } }, 3500); return;
  }
  const a = el.dataset.act, id = el.dataset.id, d = el.dataset;
  const m = id && D.partidos[id];
  switch (a) {
    case 'view': UI.view = d.v; if (d.v !== 'equipos') UI.team = null; ls.set('wl-view', d.v); render(); window.scrollTo(0, 0); break;
    case 'theme': { const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); const nx = cur === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = nx; ls.set('wl-theme', nx); break; }
    case 'bell': UI.bell = !UI.bell; $('#bell').hidden = !UI.bell; if (UI.bell) { UI.unread = 0; renderBellBadge(); renderBell(); } break;
    case 'close-modal': closeModal(); break;
    case 'pick-match': UI.match = id; UI.view = 'partidos'; render(); break;
    case 'team': UI.team = id || null; UI.view = 'equipos'; render(); window.scrollTo(0, 0); break;
    case 'div': UI.div = d.v; render(); break;
    case 'tab': UI.tab = d.t; render(); break;
    case 'goto-tab': UI.tab = d.t; UI.view = 'gestion'; render(); window.scrollTo(0, 0); break;
    case 'fav': ev.stopPropagation(); toggleFav(d.k, id); break;
    case 'coach-pick': coachTeam = id || null; ls.set('wl-coach', coachTeam); render(); break;
    case 'r-new': reportForm(d.j); break;
  }
  if (!isOrg()) return;
  switch (a) {
    case 'm-new': matchForm(); break;
    case 'm-edit': matchForm(m); break;
    case 'm-del': Store.del('partidos', id); UI.match = null; break;
    case 'm-start': Store.update('partidos', id, {estado: 'vivo', inicio: Date.now(), acum: +m.acum || 0}); break;
    case 'm-pause': Store.update('partidos', id, {estado: 'pausado', acum: elapsed(m), inicio: null}); break;
    case 'm-resume': Store.update('partidos', id, {estado: 'vivo', inicio: Date.now()}); break;
    case 'm-reopen': Store.update('partidos', id, {estado: 'pausado', pen: null}); break;
    case 'm-final': finalize(m); break;
    case 'ev-gol': eventModal(m, d.s, 'gol'); break;
    case 'ev-card': eventModal(m, d.s, d.t); break;
    case 'ev-ruleta': eventModal(m, d.s, 'ruleta'); break;
    case 'ev-undo': { const evs = (m.eventos || []).slice(0, -1), [gl, gv] = scoreOf(evs); Store.update('partidos', id, {eventos: evs, gl, gv}); break; }
    case 'n-new': newsForm(); break;
    case 'n-edit': newsForm(D.noticias[id]); break;
    case 'n-pin': Store.update('noticias', id, {fijada: !D.noticias[id].fijada}); break;
    case 'n-del': Store.del('noticias', id); break;
    case 't-new': teamForm(); break;
    case 't-edit': teamForm(D.equipos[id]); break;
    case 't-del': Store.del('equipos', id); break;
    case 'j-new': playerForm(); break;
    case 'j-edit': playerForm(D.jugadores[id]); break;
    case 'j-del': Store.del('jugadores', id); break;
    case 'j-susp': Store.update('jugadores', id, {estado: D.jugadores[id].estado === 'suspendido' ? 'activo' : 'suspendido'}); break;
    case 'j-injured': Store.update('jugadores', id, {estado: 'lesionado'}); break;
    case 'c-new': coachForm(); break;
    case 'c-edit': coachForm(D.entrenadores[id]); break;
    case 'c-del': Store.del('entrenadores', id); break;
    case 'i-new': itemForm({}, d.c); break;
    case 'i-edit': itemForm(D.inventario[id]); break;
    case 'i-del': Store.del('inventario', id); break;
    case 'i-adj': { const it = D.inventario[id]; const v = Math.min(+it.total || 0, Math.max(0, (+it.disponibles || 0) + (+d.d))); Store.update('inventario', id, {disponibles: v}); break; }
    case 'd-new': debtForm(); break;
    case 'd-edit': debtForm(D.deudas[id]); break;
    case 'd-del': Store.del('deudas', id); break;
    case 'd-toggle': Store.update('deudas', id, {pagada: !D.deudas[id].pagada}); break;
    case 'r-done': { const r = D.reportes[d.u]; if (!r) break; const items = (r.items || []).map(it => it.id === id ? Object.assign({}, it, {atendido: true}) : it); Store.update('reportes', d.u, {items}); break; }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#modal').hidden) closeModal(); else if (UI.bell) { UI.bell = false; $('#bell').hidden = true; } }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.tcard[role=button]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'mform') return; e.preventDefault();
  const fd = Object.fromEntries(new FormData(e.target));
  e.target.querySelectorAll('input[type=checkbox]').forEach(c => fd[c.name] = c.checked);
  Object.keys(fd).forEach(k => { if (typeof fd[k] !== 'string' && typeof fd[k] !== 'boolean') fd[k] = ''; });
  const fn = MODAL_SUBMIT; if (!fn) return;
  if (fn(fd) !== false) closeModal();
});
document.addEventListener('change', e => {
  if (e.target.id === 'role') { role = e.target.value; ls.set('wl-role', role); UI.view = role === 'entrenador' ? 'miequipo' : 'inicio'; render(); }
  if (e.target.id === 'solo-favs') { UI.soloFavs = e.target.checked; ls.set('wl-solofavs', UI.soloFavs); }
  if (e.target.id === 'sound') { UI.sound = e.target.checked; ls.set('wl-sound', UI.sound); }
});

/* ---------- arranque ---------- */
window.addEventListener('unhandledrejection', e => { if (e.reason && e.reason.code) e.preventDefault(); });
(function initTheme() { const t = ls.get('wl-theme', null); if (t) document.documentElement.dataset.theme = t; })();
async function boot() {
  render();
  let db = null, user = null;
  if (window.claude && typeof window.claude.use === 'function') {
    try { [db, user] = await Promise.all([window.claude.use('db').catch(() => null), window.claude.use('user').catch(() => null)]); } catch {}
  }
  if (db) {
    Store.db = db; ME.mode = 'db';
    ME.id = user ? await user.id() : null;
    ME.admin = user ? await user.canEdit() : false;
  } else {
    ME.mode = 'local'; ME.id = 'local'; ME.admin = true;
    if (!Object.keys(Store.local.data.equipos || {}).length) Store.local.data.equipos = JSON.parse(JSON.stringify(EQUIPOS_INICIALES));
  }
  if (!role || (role === 'organizador' && !ME.admin)) role = ME.admin ? 'organizador' : 'jugador';
  COLS.forEach(col => Store.watch(col, (o, cached) => {
    if (o) { if (col === 'partidos') onPartidos(o); else if (col === 'noticias') onNoticias(o); else D[col] = o; }
    if (!cached) UI.loaded[col] = true;
    scheduleRender();
  }));
  render();
}
boot();
})();
</script>
